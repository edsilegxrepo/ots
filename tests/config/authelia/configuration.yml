identity_validation:
  reset_password:
    jwt_secret: 'a_very_secure_jwt_secret_key_123456789'

server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: info

authentication_backend:
  file:
    path: '/config/users_database.yml'
    password:
      algorithm: argon2id

access_control:
  default_policy: deny
  rules:
    - domain: 'ots.local.gd'
      policy: one_factor

session:
  name: 'authelia_session'
  secret: 'a_very_secure_session_secret_key_123456789'
  cookies:
    - domain: 'local.gd'
      authelia_url: 'https://auth.local.gd:9091'
      default_redirection_url: 'https://ots.local.gd'

regulation:
  max_retries: 3
  find_time: '2m'
  ban_time: '5m'

storage:
  local:
    path: '/config/db.sqlite3'

notifier:
  filesystem:
    filename: '/config/notification.txt'
